<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Star Wars: Legion attack sequence dice calculator and simulator" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="icon" type="image/png" href="/justrollcrits_noburst_compressed.png" />
    <link rel="apple-touch-icon" href="/justrollcrits_noburst_compressed.png" />
    <title>Just Roll Crits</title>
    <!-- One-time cache cleanup: unregister old service workers and clear stale caches.
         Runs once per device, tracked via localStorage flag. Safe to remove after ~2 months. -->
         <!-- TODO: remove this script after 2026-05 -->
    <script>
      (function() {
        var FLAG = 'jrc_cache_cleared_v1';
        if (localStorage.getItem(FLAG)) return;
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
        localStorage.setItem(FLAG, '1');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
